name: hardware-management-dev

services:
  mysql:
    image: mysql:8.4
    container_name: hm-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-itam_db}
      MYSQL_USER: ${DB_USERNAME:-itam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-itampassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  dev_mysql_data:
    driver: local
