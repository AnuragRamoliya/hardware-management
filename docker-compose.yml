name: hardware-management

services:
  mysql:
    image: mysql:8.4
    container_name: hm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-itam_db}
      MYSQL_USER: ${DB_USERNAME:-itam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-itampassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: hm-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-itam_db}
      DB_USERNAME: ${DB_USERNAME:-itam_user}
      DB_PASSWORD: ${DB_PASSWORD:-itampassword}
      DB_CONNECTION: mysql
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: hm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
