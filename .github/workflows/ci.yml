name: CI Pipeline

on:
  push:
    branches:
      - main
      - chore/monorepo-setup
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    needs: [gitleaks]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: itam_db_test
          MYSQL_USER: itam_user
          MYSQL_PASSWORD: itampassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -u root -prootpassword" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: itam_db_test
          DB_USERNAME: itam_user
          DB_PASSWORD: itampassword
          DB_CONNECTION: mysql
          SECRET_KEY: test_secret_key_for_ci_environment_only_32_bytes!
          ACCESS_TOKEN_EXPIRES: 1h
          REFRESH_TOKEN_EXPIRES: 7d

      - name: Check UI Standards
        run: npm run check:ui

      - name: Build All Workspaces
        run: npm run build
